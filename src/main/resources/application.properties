spring.application.name=springdemo
server.port=9090
spring.datasource.url=jdbc:postgresql://localhost:5432/student_management
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.datasource.driver-class-name=org.postgresql.Driver
logging.level.com.example.springdemo=DEBUG
app.security.user-password=${APP_USER_PASSWORD}
app.security.admin-password=${APP_ADMIN_PASSWORD}
# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000
app.jwt.issuer=student-management-api
app.jwt.audience=student-api
